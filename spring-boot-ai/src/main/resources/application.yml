server:
  port: 8086
spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:0.6b
        options:
          max-tokens: 2048
          temperature: 0.6
    mcp:
      client:
        name: alimap
        type: async
        request-timeout: 60s
        toolcallback:
          enabled: true


logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
