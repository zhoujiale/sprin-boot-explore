server:
  port: 8086
spring:
  webflux:
    multipart:
      max-parts: 5
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:0.6b
        options:
          max-tokens: 4096
          temperature: 0.1
      embedding:
        model: nomic-embed-text:v1.5
    mcp:
      client:
        name: alimap
        type: async
        request-timeout: 60s
        toolcallback:
          enabled: true
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
          username: root
          password: milvus1234
        database-name: default
        collection-name: chat
        embedding-dimension: 768
        index-type: ivf_flat
        metric-type: cosine
        initialize-schema: true

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
